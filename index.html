<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Laboratorio 3D</title>
  <style>
    /* --- ESTILOS RESPONSIVE (100vh, sin scroll) --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100vh;
      overflow: hidden;
      background: #0b0620;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: white;
      touch-action: none; /* Evita gestos del navegador al arrastrar */
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 4px 8px; /* reducido para más espacio */
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 10, 45, 0.7);
      border: 2px solid #ffd54f;
      border-radius: 14px;
      padding: 2px 12px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 20px;
      color: #ffd54f;
      text-shadow: 2px 2px 0 #7b2ff7;
      margin: 0;
    }
    #btn-inicio {
      background: #7b2ff7;
      padding: 4px 12px;
      font-size: 14px;
      border: 2px solid white;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-left: auto;
      font-family: inherit;
    }
    #panel-nivel {
      text-align: center;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    #panel-nivel h2 {
      margin: 0;
      font-size: 17px;
      color: #7ef9ff;
    }
    #progreso {
      color: #ffd54f;
      font-weight: bold;
      font-size: 15px;
    }
    #contenedor-escenas {
      display: flex;
      flex: 1 1 auto;
      gap: 10px;
      min-height: 0;
      width: 100%;
    }
    .tarjeta-canvas {
      background: rgba(10, 5, 25, 0.6);
      border: 2px solid #7b2ff7;
      border-radius: 14px;
      padding: 4px;
      box-shadow: 0 0 20px rgba(123, 47, 247, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tarjeta-canvas.principal {
      flex: 1 1 60%;
    }
    .tarjeta-canvas.objetivo {
      flex: 0 0 30%;
      min-width: 180px;
    }
    .tarjeta-canvas canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: transparent;
    }
    #canvas-principal {
      cursor: grab;
      touch-action: none;
    }
    .etiqueta-mini {
      text-align: center;
      font-weight: bold;
      color: #ffd54f;
      margin-top: 2px;
      font-size: 12px;
      flex-shrink: 0;
    }
    #mensaje-ayuda {
      margin-top: 2px;
      font-size: 13px;
      opacity: 0.9;
      text-align: center;
      min-height: 1.2em;
      flex-shrink: 0;
    }
    #mensaje-victoria {
      font-size: 24px;
      color: #ffd54f;
      text-shadow: 3px 3px 0 #ff6f61;
      margin: 2px 0;
      display: none;
      animation: pulso 0.6s infinite alternate;
      flex-shrink: 0;
    }
    @keyframes pulso {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    .barra {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
      flex-shrink: 0;
    }
    .boton-emoji {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid white;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
    }
    .boton-emoji:hover { transform: scale(1.08); }
    .boton-emoji.activo { border-color: #ffd54f; transform: scale(1.12); }

    .boton-accion {
      padding: 8px 12px;
      border-radius: 12px;
      border: 2px solid white;
      background: #7b2ff7;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      transition: 0.1s;
      font-family: inherit;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .boton-accion:hover { transform: translateY(-2px); }
    .boton-accion:active { transform: translateY(2px); box-shadow: none; }
    #btn-reiniciar { background: #ff6f61; }
    #btn-pista { background: #29b6f6; }
    #btn-siguiente { background: #66bb6a; }
    #btn-undo { background: #607d8b; }

    /* --- PANTALLA DE MUNDOS --- */
    #pantalla-mundos {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
      padding: 16px;
    }
    #pantalla-mundos h2 {
      font-size: 28px;
      color: #ffd54f;
      text-shadow: 2px 2px 0 #7b2ff7;
    }
    .grid-mundos {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .tarjeta-mundo {
      background: rgba(20, 10, 45, 0.8);
      border: 3px solid #7b2ff7;
      border-radius: 18px;
      padding: 16px 20px;
      width: 160px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 20px rgba(123, 47, 247, 0.3);
      touch-action: manipulation;
    }
    .tarjeta-mundo:hover { transform: scale(1.05); border-color: #ffd54f; }
    .tarjeta-mundo.bloqueado { opacity: 0.5; cursor: not-allowed; }
    .tarjeta-mundo .emoji-mundo { font-size: 40px; }
    .tarjeta-mundo .nombre-mundo { font-size: 18px; font-weight: bold; color: white; }
    .tarjeta-mundo .progreso-mundo { font-size: 13px; color: #ccc; }
    .candado { font-size: 22px; margin-left: 6px; }

    @media (max-width: 700px) {
      header h1 { font-size: 16px; }
      .tarjeta-canvas.objetivo { flex: 0 0 35%; min-width: 120px; }
      .boton-emoji { width: 40px; height: 40px; font-size: 20px; }
      .boton-accion { font-size: 12px; padding: 6px 8px; }
      #panel-nivel h2 { font-size: 14px; }
      #progreso { font-size: 13px; }
      .tarjeta-mundo { width: 130px; padding: 12px; }
      .tarjeta-mundo .emoji-mundo { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🧩 Laboratorio 3D</h1>
      <button class="boton-accion" id="btn-inicio" style="background:#7b2ff7; padding:4px 12px; font-size:14px;">🏠 Inicio</button>
    </header>

    <!-- PANTALLA DE MUNDOS -->
    <div id="pantalla-mundos">
      <h2>🌍 Selecciona un Mundo</h2>
      <div class="grid-mundos" id="grid-mundos"></div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="pantalla-juego" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
      <div id="panel-nivel">
        <h2 id="titulo-nivel"></h2>
        <div id="progreso"></div>
      </div>

      <div id="contenedor-escenas">
        <div class="tarjeta-canvas principal">
          <canvas id="canvas-principal"></canvas>
        </div>
        <div class="tarjeta-canvas objetivo">
          <canvas id="canvas-objetivo"></canvas>
          <div class="etiqueta-mini">👀 MODELO A COPIAR</div>
        </div>
      </div>

      <div id="mensaje-victoria">⭐ ¡MUY BIEN! ⭐</div>
      <div id="mensaje-ayuda">Toca una pieza, luego toca otra vez para confirmar el emoji.</div>

      <div class="barra" id="barra-emojis"></div>
      <div class="barra">
        <button class="boton-accion" id="btn-reiniciar">🔄 Reiniciar</button>
        <button class="boton-accion" id="btn-undo">↩ Deshacer</button>
        <button class="boton-accion" id="btn-pista">💡 Pista</button>
        <button class="boton-accion" id="btn-siguiente">➡ Siguiente</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>
  <script>
    // ============================================================
    // 1. CONFIGURACIÓN BÁSICA (3x3 fijo)
    // ============================================================
    const TAMANO = 3;
    const ESPACIO = 1.1;
    const CENTRO = 1;

    // ============================================================
    // 2. EMOJIS COMPLETO (TODOS los que usamos)
    // ============================================================
    const EMOJIS_DISPONIBLES = [
      '🍎', '🍌', '🍇', '🐶', '🐱', '🐾', '🌟',
      '🦆', '🐄', '🐖', '🐑', '🐔', '🐴', '🐰',
      '🦁', '🐘', '🚗', '✈️',
      '🍓', '🍒', '🍑', '🚢', '🚲', '🚌', '🚂'
    ];

    // Función para crear textura con fondo blanco
    function crearTexturaEmoji(emoji, size = 128) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.font = `${size * 0.8}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.fillText(emoji, size / 2, size / 2 + size * 0.05);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // Precargar todas las texturas
    const texturasEmoji = {};
    EMOJIS_DISPONIBLES.forEach(emoji => {
      texturasEmoji[emoji] = crearTexturaEmoji(emoji);
    });
    // Textura de fallback
    texturasEmoji['❓'] = crearTexturaEmoji('❓');

    function getTextura(emoji) {
      return texturasEmoji[emoji] || texturasEmoji['❓'];
    }

    // ============================================================
    // 3. MUNDOS CON DIFICULTAD PROGRESIVA
    // ============================================================
    const MUNDOS = [{
      id: 'granja',
      nombre: 'Animales de Granja',
      emoji: '🐄',
      figuras: [
        { nombre: 'Vaca', obj: { '0,0,2': '🐄', '1,0,2': '🐄', '2,0,2': '🐄', '0,1,2': '🐄', '2,1,2': '🐄',
            '1,2,2': '🐄' } },
        { nombre: 'Cerdo', obj: { '0,0,2': '🐖', '1,0,2': '🐖', '2,0,2': '🐖', '0,1,2': '🐖', '2,1,2': '🐖',
            '1,1,2': '🐖' } },
        { nombre: 'Oveja', obj: { '0,0,2': '🐑', '1,0,2': '🐑', '2,0,2': '🐑', '0,1,2': '🐑', '2,1,2': '🐑',
            '1,2,2': '🐑' } },
        { nombre: 'Gallina', obj: { '0,0,2': '🐔', '1,0,2': '🐔', '2,0,2': '🐔', '0,1,2': '🐔', '2,1,2': '🐔',
            '1,2,2': '🐔' } },
        { nombre: 'Pato', obj: { '0,0,2': '🦆', '1,0,2': '🦆', '2,0,2': '🦆', '0,1,2': '🦆', '2,1,2': '🦆',
            '1,2,2': '🦆' } },
        { nombre: 'Conejo', obj: { '0,0,2': '🐰', '1,0,2': '🐰', '2,0,2': '🐰', '0,1,2': '🐰', '2,1,2': '🐰',
            '1,1,2': '🐰' } }
      ]
    }, {
      id: 'frutas',
      nombre: 'Frutas del Bosque',
      emoji: '🍓',
      figuras: [
        { nombre: 'Fresa', obj: { '0,0,2': '🍓', '1,0,2': '🍓', '2,0,2': '🍓', '0,1,2': '🍓', '2,1,2': '🍓',
            '1,2,2': '🍓' } },
        { nombre: 'Cereza', obj: { '0,0,2': '🍒', '1,0,2': '🍒', '2,0,2': '🍒', '0,1,2': '🍒', '2,1,2': '🍒',
            '1,1,2': '🍒' } },
        { nombre: 'Durazno', obj: { '0,0,2': '🍑', '1,0,2': '🍑', '2,0,2': '🍑', '0,1,2': '🍑', '2,1,2': '🍑',
            '1,2,2': '🍑' } },
        { nombre: 'Manzana', obj: { '0,0,2': '🍎', '1,0,2': '🍎', '2,0,2': '🍎', '1,1,2': '🍎', '1,2,2': '🍎' } },
        { nombre: 'Plátano', obj: { '0,0,2': '🍌', '1,0,2': '🍌', '2,0,2': '🍌', '1,1,2': '🍌', '0,1,2': '🍌',
            '2,1,2': '🍌' } },
        { nombre: 'Uvas', obj: { '0,0,2': '🍇', '1,0,2': '🍇', '2,0,2': '🍇', '0,1,2': '🍇', '2,1,2': '🍇',
            '1,1,2': '🍇', '1,2,2': '🍇' } }
      ]
    }, {
      id: 'transporte',
      nombre: 'Transportes',
      emoji: '🚗',
      figuras: [
        { nombre: 'Coche', obj: { '0,0,2': '🚗', '1,0,2': '🚗', '2,0,2': '🚗', '0,1,2': '🚗', '2,1,2': '🚗',
            '1,1,2': '🚗' } },
        { nombre: 'Avión', obj: { '0,0,2': '✈️', '1,0,2': '✈️', '2,0,2': '✈️', '0,1,2': '✈️', '2,1,2': '✈️',
            '1,1,2': '✈️', '1,2,2': '✈️' } },
        { nombre: 'Barco', obj: { '0,0,2': '🚢', '1,0,2': '🚢', '2,0,2': '🚢', '0,1,2': '🚢', '2,1,2': '🚢',
            '1,2,2': '🚢' } },
        { nombre: 'Bicicleta', obj: { '0,0,2': '🚲', '1,0,2': '🚲', '2,0,2': '🚲', '0,1,2': '🚲', '2,1,2': '🚲',
            '1,1,2': '🚲' } },
        { nombre: 'Autobús', obj: { '0,0,2': '🚌', '1,0,2': '🚌', '2,0,2': '🚌', '0,1,2': '🚌', '2,1,2': '🚌',
            '1,1,2': '🚌', '1,2,2': '🚌' } },
        { nombre: 'Tren', obj: { '0,0,2': '🚂', '1,0,2': '🚂', '2,0,2': '🚂', '0,1,2': '🚂', '2,1,2': '🚂',
            '1,1,2': '🚂' } }
      ]
    }];

    // ============================================================
    // 4. ESTADO DEL JUEGO
    // ============================================================
    let mundoActual = 0;
    let nivelEnMundo = 0;
    let niveles = [];
    let nivelActualIndex = 0;
    let emojiActual = EMOJIS_DISPONIBLES[0];
    let cuboSeleccionado = null;
    let figuraCompletada = false;
    let historial = [];

    // Progreso por mundo (se guarda en memoria)
    const progresoMundos = {
      0: { completados: 0 },
      1: { completados: 0 },
      2: { completados: 0 }
    };

    // ============================================================
    // 5. FUNCIONES DEL JUEGO
    // ============================================================
    function posicion3D(x, y, z) {
      const offset = (TAMANO - 1) / 2;
      return new THREE.Vector3(
        (x - offset) * ESPACIO,
        (y - offset) * ESPACIO,
        (z - offset) * ESPACIO
      );
    }

    // Cargar niveles del mundo actual, repartiendo las celdas en profundidad
    function redistribuirProfundidad(celdasXY, nivelIdx, emojiPrincipal, mundoIdx) {
      const capas = [0, 1, 2];
      let emojiSecundario = null;
      if (nivelIdx >= 2) {
        const otros = EMOJIS_DISPONIBLES.filter(e => e !== emojiPrincipal);
        emojiSecundario = otros[(mundoIdx * 3 + nivelIdx) % otros.length];
      }
      const resultado = {};
      celdasXY.forEach(([x, y], i) => {
        let z = capas[i % capas.length];
        if (x === CENTRO && y === CENTRO && z === CENTRO) {
          z = capas[(i + 1) % capas.length];
        }
        const usarSecundario = emojiSecundario && (i % 3 === 2);
        resultado[`${x},${y},${z}`] = usarSecundario ? emojiSecundario : emojiPrincipal;
      });
      return resultado;
    }

    function cargarNivelesMundo(mundoIdx) {
      const mundo = MUNDOS[mundoIdx];
      niveles = mundo.figuras.map((fig, i) => {
        const celdasXY = Object.keys(fig.obj).map(clave => {
          const [x, y] = clave.split(',').map(Number);
          return [x, y];
        });
        const emojiPrincipal = Object.values(fig.obj)[0];
        return {
          nombre: fig.nombre,
          descripcion: `Construye un ${fig.nombre.toLowerCase()}`,
          objetivo: redistribuirProfundidad(celdasXY, i, emojiPrincipal, mundoIdx)
        };
      });
      nivelActualIndex = 0;
    }

    // ============================================================
    // 6. SONIDOS (versión simplificada)
    // ============================================================
    let audioContext = null;

    function initAudio() {
      if (!audioContext) {
        audioContext = new(window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, dur, type = 'sine', vol = 0.3) {
      try {
        initAudio();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + dur);
      } catch (e) {}
    }

    function sonidoAcierto() {
      playTone(523, 0.15);
      setTimeout(() => playTone(659, 0.15), 120);
    }

    function sonidoError() {
      playTone(400, 0.2, 'sawtooth', 0.15);
    }

    function sonidoVictoria() {
      [523, 587, 659, 784, 880, 987, 1047].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.2), i * 100);
      });
    }

    function sonidoClic() {
      playTone(800, 0.05);
    }

    // ============================================================
    // 7. ESCENA PRINCIPAL (Three.js)
    // ============================================================
    const canvasPrincipal = document.getElementById('canvas-principal');
    const rendererPrincipal = new THREE.WebGLRenderer({ canvas: canvasPrincipal, antialias: true, alpha: true });
    rendererPrincipal.setPixelRatio(window.devicePixelRatio);
    rendererPrincipal.shadowMap.enabled = true;
    rendererPrincipal.shadowMap.type = THREE.PCFSoftShadowMap;

    const escenaPrincipal = new THREE.Scene();
    const camaraPrincipal = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

    // Luces ajustadas para evitar brillos exagerados
    const luzPrincipal = new THREE.DirectionalLight(0xfff5e6, 0.8);
    luzPrincipal.position.set(5, 10, 7);
    luzPrincipal.castShadow = true;
    escenaPrincipal.add(luzPrincipal);

    const luzRelleno = new THREE.DirectionalLight(0xccddff, 0.4);
    luzRelleno.position.set(-5, 0, 5);
    escenaPrincipal.add(luzRelleno);

    const luzInferior = new THREE.DirectionalLight(0xffeedd, 0.3);
    luzInferior.position.set(-4, -6, 4);
    escenaPrincipal.add(luzInferior);

    const luzPosterior = new THREE.DirectionalLight(0xccddff, 0.3);
    luzPosterior.position.set(-2, 2, -6);
    escenaPrincipal.add(luzPosterior);

    const luzAmbiente = new THREE.AmbientLight(0x404070, 0.6);
    escenaPrincipal.add(luzAmbiente);

    // Suelo
    const sueloGeo = new THREE.PlaneGeometry(8, 8);
    const sueloMat = new THREE.MeshStandardMaterial({ color: 0x222244, transparent: true, opacity: 0.2, roughness: 0.9,
      metalness: 0.0, side: THREE.DoubleSide });
    const suelo = new THREE.Mesh(sueloGeo, sueloMat);
    suelo.rotation.x = -Math.PI / 2;
    suelo.position.y = -2.2;
    suelo.receiveShadow = true;
    escenaPrincipal.add(suelo);

    // Orbit
    let orbit = { theta: 0.6, phi: 1.1, radio: 7.5 };

    function actualizarCamara(cam, o) {
      cam.position.set(
        o.radio * Math.sin(o.phi) * Math.sin(o.theta),
        o.radio * Math.cos(o.phi),
        o.radio * Math.sin(o.phi) * Math.cos(o.theta)
      );
      cam.lookAt(0, 0, 0);
    }
    actualizarCamara(camaraPrincipal, orbit);

    const geometriaCubo = new THREE.BoxGeometry(1, 1, 1);
    const cubosGrid = {};

    // Crear grilla
    function crearGrilla() {
      for (let x = 0; x < TAMANO; x++) {
        for (let y = 0; y < TAMANO; y++) {
          for (let z = 0; z < TAMANO; z++) {
            const material = new THREE.MeshStandardMaterial({
              color: 0xccccff,
              transparent: true,
              opacity: 0.15,
              roughness: 0.9,
              metalness: 0.0
            });
            const cubo = new THREE.Mesh(geometriaCubo, material);
            cubo.position.copy(posicion3D(x, y, z));
            cubo.castShadow = true;
            cubo.receiveShadow = true;
            const esCentral = (x === CENTRO && y === CENTRO && z === CENTRO);
            cubo.userData = {
              x,
              y,
              z,
              pintado: false,
              emojiActual: null,
              esCentral: esCentral,
              clave: `${x},${y},${z}`
            };

            const edges = new THREE.EdgesGeometry(geometriaCubo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x8888cc, transparent: true, opacity: 0.5 });
            const wireframe = new THREE.LineSegments(edges, lineMat);
            cubo.add(wireframe);

            if (esCentral) {
              material.opacity = 0.05;
              cubo.children.forEach(child => {
                if (child.isLineSegments) {
                  child.material.color.setHex(0xff6666);
                  child.material.opacity = 0.2;
                }
              });
            }

            escenaPrincipal.add(cubo);
            cubosGrid[`${x},${y},${z}`] = cubo;
          }
        }
      }
    }
    crearGrilla();

    // Indicador de selección
    const indicador = new THREE.Mesh(
      new THREE.BoxGeometry(1.15, 1.15, 1.15),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
    );
    indicador.visible = false;
    escenaPrincipal.add(indicador);

    // ============================================================
    // 8. ESCENA OBJETIVO
    // ============================================================
    const canvasObjetivo = document.getElementById('canvas-objetivo');
    const rendererObjetivo = new THREE.WebGLRenderer({ canvas: canvasObjetivo, antialias: true, alpha: true });
    rendererObjetivo.setPixelRatio(window.devicePixelRatio);

    const escenaObjetivo = new THREE.Scene();
    const camaraObjetivo = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

    // Luces fijas para el objetivo
    const luzObj1 = new THREE.DirectionalLight(0xfff5e6, 0.8);
    luzObj1.position.set(5, 10, 7);
    escenaObjetivo.add(luzObj1);
    const luzObj2 = new THREE.DirectionalLight(0xccddff, 0.4);
    luzObj2.position.set(-5, 0, 5);
    escenaObjetivo.add(luzObj2);
    const luzObj3 = new THREE.DirectionalLight(0xffeedd, 0.3);
    luzObj3.position.set(-4, -6, 4);
    escenaObjetivo.add(luzObj3);
    const luzObj4 = new THREE.DirectionalLight(0xccddff, 0.3);
    luzObj4.position.set(-2, 2, -6);
    escenaObjetivo.add(luzObj4);
    escenaObjetivo.add(new THREE.AmbientLight(0x404070, 0.6));

    let cubosObjetivoActuales = [];

    function dibujarObjetivo() {
      cubosObjetivoActuales.forEach(c => escenaObjetivo.remove(c));
      cubosObjetivoActuales = [];
      const objetivo = niveles[nivelActualIndex].objetivo;
      for (const clave in objetivo) {
        if (clave === `${CENTRO},${CENTRO},${CENTRO}`) continue;
        const [x, y, z] = clave.split(',').map(Number);
        const emoji = objetivo[clave];
        const texture = getTextura(emoji);
        if (!texture) continue;
        const material = new THREE.MeshStandardMaterial({
          map: texture,
          color: 0xffffff,
          roughness: 0.9,
          metalness: 0.0,
          transparent: false
        });
        const cubo = new THREE.Mesh(geometriaCubo, material);
        cubo.position.copy(posicion3D(x, y, z));
        const edges = new THREE.EdgesGeometry(geometriaCubo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 });
        const wireframe = new THREE.LineSegments(edges, lineMat);
        cubo.add(wireframe);
        escenaObjetivo.add(cubo);
        cubosObjetivoActuales.push(cubo);
      }
    }

    // ============================================================
    // 9. LÓGICA DE JUEGO
    // ============================================================
    function contarCorrectos() {
      const objetivo = niveles[nivelActualIndex].objetivo;
      let total = 0;
      for (const clave in objetivo) {
        const cubo = cubosGrid[clave];
        if (cubo && cubo.userData.pintado && cubo.userData.emojiActual === objetivo[clave]) {
          total++;
        }
      }
      return total;
    }

    function actualizarProgreso() {
      const nivel = niveles[nivelActualIndex];
      document.getElementById('titulo-nivel').textContent =
        `${nivel.nombre} - ${nivel.descripcion}`;
      const correctos = contarCorrectos();
      const total = Object.keys(nivel.objetivo).length;
      document.getElementById('progreso').textContent =
        `Progreso: ${correctos} / ${total} piezas correctas`;
    }

    function figuraCompleta() {
      const objetivo = niveles[nivelActualIndex].objetivo;
      for (const clave in objetivo) {
        const cubo = cubosGrid[clave];
        if (!cubo || !cubo.userData.pintado || cubo.userData.emojiActual !== objetivo[clave]) {
          return false;
        }
      }
      return true;
    }

    function celebrar() {
      const el = document.getElementById('mensaje-victoria');
      el.style.display = 'block';
      const objetivo = niveles[nivelActualIndex].objetivo;
      for (const clave in objetivo) {
        const cubo = cubosGrid[clave];
        if (cubo) cubo.scale.set(1.18, 1.18, 1.18);
      }
      // Partículas simples
      const particulas = [];
      const colores = [0xffd54f, 0xff6f61, 0x7ef9ff, 0x66bb6a, 0x7b2ff7];
      const claves = Object.keys(objetivo);
      for (let i = 0; i < 60; i++) {
        const size = 0.06 + Math.random() * 0.18;
        const geo = new THREE.SphereGeometry(size, 6, 6);
        const mat = new THREE.MeshStandardMaterial({
          color: colores[Math.floor(Math.random() * colores.length)],
          emissive: 0xffffff,
          emissiveIntensity: 0.6,
          transparent: true,
          opacity: 1
        });
        const p = new THREE.Mesh(geo, mat);
        const clave = claves[Math.floor(Math.random() * claves.length)];
        const [x, y, z] = clave.split(',').map(Number);
        const base = posicion3D(x, y, z);
        p.position.set(
          base.x + (Math.random() - 0.5) * 3,
          base.y + (Math.random() - 0.5) * 3,
          base.z + (Math.random() - 0.5) * 3
        );
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 0.08,
            Math.random() * 0.10 + 0.02,
            (Math.random() - 0.5) * 0.08
          ),
          vida: 1.0,
          decay: 0.005 + Math.random() * 0.015
        };
        escenaPrincipal.add(p);
        particulas.push(p);
      }

      function animarParticulas() {
        let activas = false;
        particulas.forEach(p => {
          p.userData.vida -= p.userData.decay;
          if (p.userData.vida <= 0) { p.visible = false; return; }
          activas = true;
          p.position.add(p.userData.vel);
          p.userData.vel.y -= 0.001;
          p.material.opacity = p.userData.vida;
          p.scale.setScalar(0.5 + p.userData.vida * 0.5);
        });
        if (activas) {
          requestAnimationFrame(animarParticulas);
        } else {
          particulas.forEach(p => escenaPrincipal.remove(p));
        }
      }
      animarParticulas();

      sonidoVictoria();
    }

    function reiniciarNivel() {
      figuraCompletada = false;
      historial = [];
      document.getElementById('mensaje-victoria').style.display = 'none';
      indicador.visible = false;
      cuboSeleccionado = null;
      for (const clave in cubosGrid) {
        const cubo = cubosGrid[clave];
        cubo.material.map = null;
        cubo.material.color.setHex(0xccccff);
        cubo.material.opacity = cubo.userData.esCentral ? 0.05 : 0.15;
        cubo.material.needsUpdate = true;
        cubo.userData.pintado = false;
        cubo.userData.emojiActual = null;
        cubo.scale.set(1, 1, 1);
        cubo.children.forEach(child => {
          if (child.isLineSegments) {
            child.material.opacity = cubo.userData.esCentral ? 0.2 : 0.5;
          }
        });
        cubo.material.emissive = new THREE.Color(0x000000);
        cubo.material.emissiveIntensity = 0;
      }
      actualizarProgreso();
      actualizarBarraEmojisParaNivel(nivelActualIndex);
    }

    function siguienteNivel() {
      if (nivelActualIndex < niveles.length - 1) {
        nivelActualIndex++;
        reiniciarNivel();
        dibujarObjetivo();
        document.getElementById('mensaje-ayuda').textContent = 'Nuevo nivel. ¡A construir!';
      } else {
        // Mundo completado
        progresoMundos[mundoActual].completados = niveles.length;
        document.getElementById('mensaje-ayuda').textContent = '🎉 ¡Mundo completado! Volviendo al menú...';
        setTimeout(() => {
          mostrarMundos();
        }, 1500);
      }
    }

    function deshacerUltimo() {
      if (historial.length === 0) {
        document.getElementById('mensaje-ayuda').textContent = 'No hay acciones para deshacer.';
        return;
      }
      const clave = historial.pop();
      const cubo = cubosGrid[clave];
      if (!cubo) return;
      cubo.material.map = null;
      cubo.material.color.setHex(0xccccff);
      cubo.material.opacity = cubo.userData.esCentral ? 0.05 : 0.15;
      cubo.material.needsUpdate = true;
      cubo.userData.pintado = false;
      cubo.userData.emojiActual = null;
      cubo.scale.set(1, 1, 1);
      cubo.children.forEach(child => {
        if (child.isLineSegments) {
          child.material.opacity = cubo.userData.esCentral ? 0.2 : 0.5;
        }
      });
      cubo.material.emissive = new THREE.Color(0x000000);
      cubo.material.emissiveIntensity = 0;

      figuraCompletada = false;
      document.getElementById('mensaje-victoria').style.display = 'none';
      if (cuboSeleccionado === cubo) {
        indicador.visible = false;
        cuboSeleccionado = null;
      }
      actualizarProgreso();
      document.getElementById('mensaje-ayuda').textContent = '¡Pieza deshecha!';
    }

    function barajar(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    // Arma la barra de emojis para un nivel especifico
    function actualizarBarraEmojisParaNivel(nivelIdx) {
      const objetivo = niveles[nivelIdx].objetivo;
      const emojisNecesarios = Array.from(new Set(Object.values(objetivo)));
      const distractoresDisponibles = EMOJIS_DISPONIBLES.filter(e => !emojisNecesarios.includes(e));
      const numDistractores = Math.min(2 + nivelIdx, distractoresDisponibles.length);
      const distractoresElegidos = barajar(distractoresDisponibles).slice(0, numDistractores);
      const listaFinal = barajar([...emojisNecesarios, ...distractoresElegidos]);
      actualizarBarraEmojis(listaFinal);
    }

    // ============================================================
    // 11. BOTONES DE EMOJIS
    // ============================================================
    function actualizarBarraEmojis(emojis) {
      const contenedor = document.getElementById('barra-emojis');
      contenedor.innerHTML = '';
      if (emojis.length === 0) {
        emojis = EMOJIS_DISPONIBLES.slice(0, 6);
      }
      emojis.forEach((emoji, i) => {
        const btn = document.createElement('button');
        btn.className = 'boton-emoji' + (i === 0 ? ' activo' : '');
        btn.textContent = emoji;
        btn.title = `Emoji ${emoji}`;
        btn.addEventListener('click', () => {
          emojiActual = emoji;
          document.querySelectorAll('.boton-emoji').forEach(b => b.classList.remove('activo'));
          btn.classList.add('activo');
          document.getElementById('mensaje-ayuda').textContent =
            `Emoji: ${emoji}. Toca una pieza dos veces.`;
        });
        contenedor.appendChild(btn);
      });
      emojiActual = emojis[0] || EMOJIS_DISPONIBLES[0];
    }

    // ============================================================
    // 12. NAVEGACIÓN ENTRE MUNDOS
    // ============================================================
    function mostrarMundos() {
      document.getElementById('pantalla-mundos').style.display = 'flex';
      document.getElementById('pantalla-juego').style.display = 'none';
      const grid = document.getElementById('grid-mundos');
      grid.innerHTML = '';
      MUNDOS.forEach((mundo, idx) => {
        const completados = progresoMundos[idx].completados || 0;
        const total = mundo.figuras.length;
        const totalMundoPrevio = idx > 0 ? MUNDOS[idx - 1].figuras.length : 0;
        const bloqueado = (idx > 0 && progresoMundos[idx - 1].completados < totalMundoPrevio);

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-mundo' + (bloqueado ? ' bloqueado' : '');
        tarjeta.innerHTML = `
              <div class="emoji-mundo">${mundo.emoji}</div>
              <div class="nombre-mundo">${mundo.nombre}</div>
              <div class="progreso-mundo">${completados} / ${total} niveles</div>
              ${bloqueado ? '<div class="candado">🔒</div>' : ''}
            `;
        if (!bloqueado) {
          tarjeta.addEventListener('click', () => {
            iniciarMundo(idx);
          });
        }
        grid.appendChild(tarjeta);
      });
    }

    function iniciarMundo(idx) {
      mundoActual = idx;
      cargarNivelesMundo(idx);
      nivelActualIndex = 0;
      document.getElementById('pantalla-mundos').style.display = 'none';
      document.getElementById('pantalla-juego').style.display = 'flex';
      reiniciarNivel();
      dibujarObjetivo();
      setTimeout(resizeRenderer, 100);
    }

    // ============================================================
    // 13. REDIMENSIONADO DE RENDERERS (con soporte táctil)
    // ============================================================
    function resizeRenderer() {
      const w1 = canvasPrincipal.clientWidth;
      const h1 = canvasPrincipal.clientHeight;
      if (w1 > 0 && h1 > 0) {
        rendererPrincipal.setSize(w1, h1, false);
        camaraPrincipal.aspect = w1 / h1;
        camaraPrincipal.updateProjectionMatrix();
      }
      const w2 = canvasObjetivo.clientWidth;
      const h2 = canvasObjetivo.clientHeight;
      if (w2 > 0 && h2 > 0) {
        rendererObjetivo.setSize(w2, h2, false);
        camaraObjetivo.aspect = w2 / h2;
        camaraObjetivo.updateProjectionMatrix();
      }
    }

    const resizeObserver = new ResizeObserver(() => { resizeRenderer(); });
    resizeObserver.observe(canvasPrincipal);
    resizeObserver.observe(canvasObjetivo);
    window.addEventListener('resize', resizeRenderer);

    // ============================================================
    // 14. INTERACCIÓN TÁCTIL PARA ROTAR LA CÁMARA
    // ============================================================
    // Reemplazamos los eventos de mouse por eventos táctiles, manteniendo
    // la compatibilidad con mouse (para escritorio).
    // Para iPad: touchstart, touchmove, touchend.

    let touchStartX = 0,
      touchStartY = 0;
    let touchThetaStart = 0,
      touchPhiStart = 0;
    let isTouching = false;

    canvasPrincipal.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      if (!touch) return;
      isTouching = true;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchThetaStart = orbit.theta;
      touchPhiStart = orbit.phi;
    }, { passive: false });

    canvasPrincipal.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isTouching) return;
      const touch = e.touches[0];
      if (!touch) return;
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        orbit.theta = touchThetaStart - dx * 0.008;
        orbit.phi = Math.min(Math.max(touchPhiStart - dy * 0.008, 0.3), Math.PI - 0.3);
      }
    }, { passive: false });

    canvasPrincipal.addEventListener('touchend', (e) => {
      e.preventDefault();
      // Si no hubo movimiento significativo, lo interpretamos como clic/tap
      if (isTouching && e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        // Simulamos un clic en la posición del toque
        manejarClicTactil(touch.clientX, touch.clientY);
      }
      isTouching = false;
    }, { passive: false });

    // También soportamos mouse para escritorio
    let mouseDown = false;
    let mouseStartX = 0,
      mouseStartY = 0;
    let mouseThetaStart = 0,
      mousePhiStart = 0;
    let mouseMoved = false;

    canvasPrincipal.addEventListener('mousedown', (e) => {
      mouseDown = true;
      mouseMoved = false;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      mouseThetaStart = orbit.theta;
      mousePhiStart = orbit.phi;
    });

    window.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
      const dx = e.clientX - mouseStartX;
      const dy = e.clientY - mouseStartY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) mouseMoved = true;
      orbit.theta = mouseThetaStart - dx * 0.008;
      orbit.phi = Math.min(Math.max(mousePhiStart - dy * 0.008, 0.3), Math.PI - 0.3);
    });

    window.addEventListener('mouseup', (e) => {
      if (!mouseDown) return;
      mouseDown = false;
      if (!mouseMoved) {
        // Clic sin arrastre
        manejarClic(e);
        sonidoClic();
      }
    });

    // Función auxiliar para el clic táctil
    function manejarClicTactil(clientX, clientY) {
      const rect = canvasPrincipal.getBoundingClientRect();
      const mouseNDC = new THREE.Vector2();
      mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      // Reutilizamos la lógica de clic
      manejarClicConNDC(mouseNDC);
      sonidoClic();
    }

    // Función original manejarClic adaptada para usar NDC
    function manejarClicConNDC(mouseNDC) {
      if (figuraCompletada) return;
      raycaster.setFromCamera(mouseNDC, camaraPrincipal);
      const intersecciones = raycaster.intersectObjects(Object.values(cubosGrid));
      if (intersecciones.length === 0) {
        indicador.visible = false;
        cuboSeleccionado = null;
        return;
      }
      const cubo = intersecciones[0].object;

      if (cubo.userData.esCentral) {
        document.getElementById('mensaje-ayuda').textContent = '⛔ El cubo central no se puede usar.';
        indicador.visible = false;
        cuboSeleccionado = null;
        return;
      }

      if (cubo !== cuboSeleccionado) {
        cuboSeleccionado = cubo;
        indicador.position.copy(cubo.position);
        indicador.visible = true;
        return;
      }

      // Pintar
      const objetivo = niveles[nivelActualIndex].objetivo;
      const texture = getTextura(emojiActual);
      if (!texture) return;

      cubo.material.map = texture;
      cubo.material.color.setHex(0xffffff);
      cubo.material.opacity = 1.0;
      cubo.material.roughness = 0.9;
      cubo.material.metalness = 0.0;
      cubo.material.needsUpdate = true;
      cubo.userData.pintado = true;
      cubo.userData.emojiActual = emojiActual;
      cubo.scale.set(1.15, 1.15, 1.15);
      setTimeout(() => { cubo.scale.set(1, 1, 1); }, 150);
      cubo.children.forEach(child => {
        if (child.isLineSegments) {
          child.material.opacity = 0.7;
        }
      });

      const clave = `${cubo.userData.x},${cubo.userData.y},${cubo.userData.z}`;
      historial.push(clave);

      const esCorrecto = (cubo.userData.pintado && cubo.userData.emojiActual === objetivo[clave]);

      if (esCorrecto) {
        sonidoAcierto();
        let parpadeo = true;
        const intervalo = setInterval(() => {
          cubo.material.emissive = new THREE.Color(parpadeo ? 0xffffaa : 0x000000);
          cubo.material.emissiveIntensity = 0.3;
          parpadeo = !parpadeo;
        }, 250);
        setTimeout(() => {
          clearInterval(intervalo);
          cubo.material.emissive = new THREE.Color(0x000000);
          cubo.material.emissiveIntensity = 0;
        }, 2000);
        document.getElementById('mensaje-ayuda').textContent = '✅ ¡Correcto! Sigue así.';
      } else {
        sonidoError();
        document.getElementById('mensaje-ayuda').textContent = '❌ No coincide con el modelo. Intenta de nuevo.';
      }

      indicador.visible = false;
      cuboSeleccionado = null;

      if (figuraCompleta()) {
        figuraCompletada = true;
        celebrar();
      } else {
        actualizarProgreso();
      }
    }

    // La función manejarClic original se redirige a manejarClicConNDC
    function manejarClic(e) {
      const rect = canvasPrincipal.getBoundingClientRect();
      const mouseNDC = new THREE.Vector2();
      mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      manejarClicConNDC(mouseNDC);
    }

    // ============================================================
    // 15. BOTONES DE ACCIÓN
    // ============================================================
    document.getElementById('btn-reiniciar').addEventListener('click', reiniciarNivel);
    document.getElementById('btn-undo').addEventListener('click', deshacerUltimo);

    document.getElementById('btn-pista').addEventListener('click', () => {
      const objetivo = niveles[nivelActualIndex].objetivo;
      for (const clave in objetivo) {
        const cubo = cubosGrid[clave];
        if (!cubo || !cubo.userData.pintado || cubo.userData.emojiActual !== objetivo[clave]) {
          const texPista = getTextura('❓');
          if (texPista) {
            cubo.material.map = texPista;
            cubo.material.color.setHex(0xffffff);
            cubo.material.opacity = 1.0;
            cubo.material.needsUpdate = true;
          }
          setTimeout(() => {
            if (!cubo.userData.pintado) {
              cubo.material.map = null;
              cubo.material.color.setHex(0xccccff);
              cubo.material.opacity = 0.15;
              cubo.material.needsUpdate = true;
            } else {
              const tex = getTextura(cubo.userData.emojiActual);
              if (tex) {
                cubo.material.map = tex;
                cubo.material.color.setHex(0xffffff);
                cubo.material.opacity = 1.0;
                cubo.material.needsUpdate = true;
              }
            }
          }, 1500);
          document.getElementById('mensaje-ayuda').textContent = `💡 Pista: pieza (${clave}) parpadea.`;
          return;
        }
      }
      document.getElementById('mensaje-ayuda').textContent = '💡 ¡Ya tienes todas las piezas correctas!';
    });

    document.getElementById('btn-siguiente').addEventListener('click', () => {
      if (figuraCompletada) {
        siguienteNivel();
      } else {
        document.getElementById('mensaje-ayuda').textContent = 'Primero completa la figura.';
      }
    });

    document.getElementById('btn-inicio').addEventListener('click', () => {
      mostrarMundos();
    });

    // ============================================================
    // 16. INICIO DEL JUEGO
    // ============================================================
    mostrarMundos();

    function animar() {
      requestAnimationFrame(animar);
      actualizarCamara(camaraPrincipal, orbit);
      const orbitObj = { theta: orbit.theta, phi: orbit.phi, radio: 6.5 };
      actualizarCamara(camaraObjetivo, orbitObj);
      rendererPrincipal.render(escenaPrincipal, camaraPrincipal);
      rendererObjetivo.render(escenaObjetivo, camaraObjetivo);
    }
    animar();

    // Forzar un resize inicial
    setTimeout(resizeRenderer, 200);
  </script>
</body>
</html>
